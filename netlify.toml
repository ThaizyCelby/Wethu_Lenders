[build]
  publish = "."
  command = ""

# ---------- Security headers (all routes) ----------
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; img-src 'self' data:; script-src 'self'; style-src 'self' https://cdnjs.cloudflare.com https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com https://cdnjs.cloudflare.com; connect-src 'self'; upgrade-insecure-requests"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=(), payment=(), usb=()"
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
    X-Frame-Options = "DENY"
    Cross-Origin-Opener-Policy = "same-origin"
    Cross-Origin-Resource-Policy = "same-origin"
    X-XSS-Protection = "0"

# ---------- Cache immutable assets ----------
[[headers]]
  for = "/Images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/Static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/Script/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=300, must-revalidate"

# ---------- security.txt content-type ----------
[[headers]]
  for = "/.well-known/security.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"
    Cache-Control = "public, max-age=3600"

# ---------- Redirect www → apex (wethuml.co.za) ----------
[[redirects]]
  from = "https://www.wethuml.co.za/*"
  to = "https://wethuml.co.za/:splat"
  status = 301
  force = true

# ---------- Pretty URL fallback ----------
[[redirects]]
  from = "/apply"
  to = "/Pages/apply.html"
  status = 200

[[redirects]]
  from = "/contact"
  to = "/Pages/contact.html"
  status = 200

[[redirects]]
  from = "/about"
  to = "/Pages/about.html"
  status = 200

[[redirects]]
  from = "/faq"
  to = "/Pages/faq.html"
  status = 200

[[redirects]]
  from = "/team"
  to = "/Pages/merchandise.html"
  status = 200