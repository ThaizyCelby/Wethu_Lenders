name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: JavaScript syntax check
        run: |
          set -e
          for f in Script/*.js; do
            echo "Checking $f"
            node --check "$f"
          done

      - name: Fail on dangerous DOM/JS patterns
        run: |
          set -e
          if grep -RIn --include="*.html" --include="*.js" \
             -E "innerHTML|outerHTML|insertAdjacentHTML|document\.write|eval\(|new Function" . ; then
            echo "::error::Unsafe DOM/JS pattern found"; exit 1
          fi

      - name: Fail on client-side storage
        run: |
          set -e
          if grep -RIn --include="*.html" --include="*.js" \
             -E "localStorage|sessionStorage|document\.cookie|indexedDB" . ; then
            echo "::error::Client-side storage detected"; exit 1
          fi

      - name: Fail on ID-number collection
        run: |
          set -e
          if grep -RIn --include="*.html" --include="*.js" \
             -E "idNumber|id_number|ID Number|SA ID" . ; then
            echo "::error::ID number collection detected"; exit 1
          fi

      - name: Fail on legacy phone numbers
        run: |
          set -e
          if grep -RIn --include="*.html" --include="*.js" \
             -E "0726196719|27726196719|072 619 6719" . ; then
            echo "::error::Legacy phone number found"; exit 1
          fi

      - name: Verify WhatsApp number consistency
        run: |
          set -e
          BAD=$(grep -Rho --include="*.html" --include="*.js" -E "wa\.me/[0-9]+" . | sort -u | grep -v "wa.me/27723248511" || true)
          if [ -n "$BAD" ]; then
            echo "::error::Unexpected wa.me destination(s):"; echo "$BAD"; exit 1
          fi

      - name: Fail on inline style/script attributes (CSP)
        run: |
          set -e
          if grep -RIn --include="*.html" -E 'style="' . ; then
            echo "::error::Inline style attribute found"; exit 1
          fi
          if grep -RnE '<script' --include="*.html" . | grep -vE 'src=|application/ld\+json'; then
            echo "::error::Inline <script> found"; exit 1
          fi

      - name: Detect missing local assets
        run: |
          set -e
          for hard in Static/styles.css Script/config.js Script/main.js ; do
            if [ ! -f "$hard" ]; then
              echo "::error::Missing critical asset: $hard"; exit 1
            fi
          done
          for soft in Images/favicon-16.png Images/favicon-32.png Images/apple-touch-icon.png Images/og-cover.jpg Images/image.jpeg Images/profile.jpeg ; do
            if [ ! -f "$soft" ]; then
              echo "::warning::Missing referenced asset: $soft"
            fi
          done

      - name: Fail on http:// asset references
        run: |
          set -e
          if grep -RIn --include="*.html" --include="*.css" --include="*.js" \
             -E 'src="http://|href="http://' . ; then
            echo "::error::Mixed content reference found"; exit 1
          fi

      - name: Detect duplicated CSS blocks
        run: |
          set -e
          COUNT=$(grep -c "=== TEAM PAGE ===" Static/styles.css || true)
          if [ "$COUNT" -gt 1 ]; then
            echo "::error::Duplicated CSS block: TEAM PAGE ($COUNT occurrences)"; exit 1
          fi

      - name: Fail on visible placeholders
        run: |
          set -e
          if grep -RIn --include="*.html" -E "\[[^]]*(Name|Insert|Role|Date|TBA)[^]]*\]" . ; then
            echo "::error::Placeholder text found in HTML"; exit 1
          fi

      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: HTML validation
        run: |
          npm install --no-save html-validate@9
          npx html-validate "**/*.html"

      - name: CSS lint
        run: |
          npm install --no-save stylelint@16 stylelint-config-standard@36
          npx stylelint "Static/**/*.css"

      - name: Broken internal link check
        run: |
          npm install --no-save linkinator@6
          npx linkinator . --recurse --skip "^https?://"